type = "card"
title = "图书"
description = "团团的书房馆藏一览。均为本人亲测精读,阅读量与零食摄入量呈显著正相关。"

[[items]]
title = "《不爱刷牙的脏脏鳄》"
subtitle = "牙齿卫生警示类 · 床头柜常备"
date = "2026"
content = "著名牙齿卫生题材读物,讲述脏脏鳄因为不刷牙失去朋友的故事。团团阅后深受触动,郑重表示自己不要像脏脏鳄一样脏。值得一提的是,团团已将全书倒背如流——教育效果立竿见影,远超预期。"
tags = ["牙齿卫生", "教育典范", "倒背如流"]

[[items]]
title = "《好饿的毛毛虫》"
subtitle = "干饭学启蒙经典"
date = "2026"
content = "国际干饭学开山之作:毛毛虫从周一吃到周日,团团从早吃到晚,二者存在强烈的跨物种共鸣。书页上的食物圆洞已被咬掉两处(真人实测)。"
tags = ["干饭学", "跨物种共鸣", "经典"]

[[items]]
title = "《猜猜我有多爱你》"
subtitle = "亲子关系量化学启蒙"
date = "2025"
content = "小兔子与大兔子的经典比试。团团据此掌握了「这么多」「跳这么高」「到月亮再回来」等计量单位,但对「我爱你到月亮再回来」仍持保留意见:「那我晚上吃什么?」"
tags = ["亲子", "计量单位", "睡前读物"]

[[items]]
title = "《大卫,不可以》"
subtitle = "行为规范教科书"
date = "2025"
content = "全屋引用率最高的一句话的来源地。书中场景在团团家中几乎全部复现(踩凳子、玩食物、不睡觉),唯独大卫最后那句「妈妈抱抱」被团团执行得最好。"
tags = ["行为规范", "高频引用"]

[[items]]
title = "《我爸爸》"
subtitle = "父亲的形象管理读物"
date = "2025"
content = "书中爸爸「像房子一样高大」「吃得像马一样多」。团团读毕要求爸爸对照执行,爸爸表示:「尽力。」团团点点头,继续翻到下一页。"
tags = ["爸爸", "形象管理"]

[[items]]
title = "《我妈妈》"
subtitle = "母亲的赞歌(及沙发赞歌)"
date = "2025"
content = "团团最认可的部分:妈妈「像沙发一样舒服」。作为资深沙发登顶研究者,他表示这是全书最严谨的一个比喻,并当场在妈妈身上测试了柔软度。"
tags = ["妈妈", "沙发学", "严谨比喻"]

[[items]]
title = "《汪汪队立大功》"
subtitle = "汪汪队主义学派指定教材"
date = "2024"
content = "学派思想纲领的官方载体。团团可全文背诵核心口号「没有困难的工作,只有勇敢的狗狗」,并已将此信念应用到撬开零食柜、翻越围栏等日常任务中。"
tags = ["汪汪队主义", "指定教材", "全文背诵"]

[[items]]
title = "《晚安,月亮》"
subtitle = "睡前仪式指定读物"
date = "2024"
content = "经典睡前读物:向房间里的一切道晚安。团团读完礼貌地向月亮道了晚安,然后宣布:「现在讲汪汪队。」睡眠改善效果有限,礼仪教学效果显著。"
tags = ["睡前读物", "礼仪教学"]

[[items]]
title = "《月亮的味道》"
subtitle = "干饭学延伸课题"
date = "2025"
content = "动物们叠罗汉够月亮的故事。团团读完立即要求采购月亮一个,被婉拒后自行爬上沙发叠罗汉,目前正在攻关中。课题进展:沙发上堆了三只枕头。"
tags = ["干饭学", "登高课题", "月亮"]

[[items]]
title = "《彩虹色的花》"
subtitle = "分享教育实践读物"
date = "2026"
content = "讲述花朵把花瓣分给需要的小动物的故事。团团深受感动,决定把饼干分给狗狗——在吃掉第一块、第二块和第三块之后。精神已到位,物质待落实。"
tags = ["分享", "精神胜利"]
